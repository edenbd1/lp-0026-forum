name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libsodium-dev libsqlite3-dev nlohmann-json3-dev pkg-config cmake
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install libsodium sqlite nlohmann-json pkg-config
      - name: module.json mirrors metadata.json
        if: runner.os == 'Linux'
        run: |
          python3 - <<'PY'
          import json
          m = json.load(open("metadata.json")); j = json.load(open("module.json"))
          bad = [k for k in j if k not in ("_note", "source_of_truth") and j[k] != m.get(k)]
          assert not bad, f"module.json differs from metadata.json on: {bad}"
          print("module.json matches metadata.json")
          PY
      - name: Build
        run: cmake -S core -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j
      - name: Test
        run: ./build/forum_core_tests

  module:
    name: Basecamp module (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Build the portable package
        run: nix build .#lgx-portable --accept-flake-config -L -o result
      - name: Pin dependency versions
        run: python3 scripts/pin-deps.py result/logos-logos_forum-module.lgx logos_forum.lgx
      - name: Check the package
        run: |
          mkdir pkg && tar xzf logos_forum.lgx -C pkg
          python3 - <<'PY'
          import json, os, sys
          m = json.load(open("pkg/manifest.json"))
          variants = sorted(os.listdir("pkg/variants"))
          print("name", m["name"], "version", m["version"], "variants", variants)
          print("dependencies", m["dependencies"])
          assert m["type"] == "ui_qml" and m["view"] == "qml/Main.qml"
          assert {"name": "storage_module", "version": "~3.0.0"} in m["dependencies"]
          assert {"name": "delivery_module", "version": "~0.3.0"} in m["dependencies"]
          # logos.test runs RLN: Basecamp must install and load the RLN modules.
          assert {"name": "liblogos_rln_module", "version": "~0.10.0"} in m["dependencies"]
          assert {"name": "liblogos_lez_rln_module", "version": "~4.2.1"} in m["dependencies"]
          for v in variants:
              main = m["main"][v]
              assert os.path.exists(f"pkg/variants/{v}/{main}"), main
              assert os.path.exists(f"pkg/variants/{v}/qml/Main.qml")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: logos_forum-${{ runner.os }}-${{ runner.arch }}
          path: logos_forum.lgx

  package:
    name: multi-platform package
    needs: module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge macOS and Linux into one .lgx
        run: |
          nix build github:logos-co/logos-package --accept-flake-config -o lgxtool
          ./lgxtool/bin/lgx merge parts/*/logos_forum.lgx -o logos_forum.lgx -y
          ./lgxtool/bin/lgx verify logos_forum.lgx
          mkdir m && tar xzf logos_forum.lgx -C m && ls m/variants
          test -d m/variants/linux-amd64 && test -d m/variants/darwin-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: logos_forum-all-platforms
          path: logos_forum.lgx
